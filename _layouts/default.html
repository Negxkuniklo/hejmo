<!DOCTYPE html>
<html lang="{{ site.lang | default: "ja" }}">

  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,maximum-scale=2">
    <meta name="color-scheme" content="only light">
    <meta name="theme-color" content="#9888cc">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

{% seo %}
  </head>

  <body>

    <!-- HEADER -->
    <div id="header_wrap" class="outer">
        <header class="inner">
          <h1 id="project_title"><a href="{{ '/' | relative_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
          <div class="header-divider" aria-hidden="true">🌙</div>
          <p id="project_tagline">{{ site.description | default: site.github.project_tagline }}</p>
        </header>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main_content_wrap" class="outer">
      <section id="main_content" class="inner">
        {{ content }}
      </section>
    </div>

    <!-- FOOTER  -->
    <div id="footer_wrap" class="outer">
      <footer class="inner">
        <p class="footer-motif" aria-hidden="true">── 🌙 ❄️ 🐇 ──</p>
        <p class="copyright">
          <a href="{{ '/' | relative_url }}">{{ site.title | default: "Nonna Neĝkuniklo" }}</a>
        </p>
      </footer>
    </div>
  </body>
</html>
